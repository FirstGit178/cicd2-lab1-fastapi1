name: CI

on:
  push:
  pull_request:

  jobs:
    test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repo
      uses: actions/checkout@v4

    - name: Setup python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Run pull_requirements
      run: pip install -0r requirements.txt

    -name: Run tests and coverage
      run: python -m pytest --cov=app --cov-report=term-missing